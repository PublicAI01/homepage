# .github/workflows/deploy.yml

name: Build and Deploy on Server

on:
  push:
    branches:
      - main

# Serialize deployments; queue rather than cancel a run already in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR image names must be lowercase.
  IMAGE_REPO: ghcr.io/publicai01/homepage
  CONTAINER_NAME: homepage-container
  # Image tags to retain. Must be >= 2 so a rollback target stays available.
  KEEP_IMAGES: 3

jobs:
  ci_check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      # Type checking only; the production build runs in build_push.
      # `next typegen` emits next-env.d.ts and .next/types, which are
      # gitignored and needed to resolve image and route module types.
      - name: Typecheck
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

  build_push:
    name: Build & Push Image
    needs: ci_check # Do not build if lint or types fail.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          # Build cache is kept in GitHub Actions Cache (10 GB, LRU-evicted).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy
    needs: build_push # Do not deploy if the image was not pushed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          IMAGE_REPO: ${{ env.IMAGE_REPO }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          KEEP_IMAGES: ${{ env.KEEP_IMAGES }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived token; expires when this job finishes.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Runtime-only configuration; never baked into the image.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
          OFFICIAL_ACCOUNTS_JSON: ${{ secrets.OFFICIAL_ACCOUNTS_JSON }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: IMAGE,IMAGE_REPO,CONTAINER_NAME,KEEP_IMAGES,GHCR_USER,GHCR_TOKEN,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,RECAPTCHA_SECRET_KEY,CONTACT_EMAIL_TO,OFFICIAL_ACCOUNTS_JSON
          script: |
            # Required: without set -e a failed command would not fail the job.
            set -euo pipefail

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # No -S: early attempts fail while the container boots.
            probe() { curl -fs -o /dev/null --max-time 3 http://127.0.0.1:3000/; }

            health_check() {
              for i in $(seq 1 30); do
                if probe; then echo "Health check passed (attempt $i)"; return 0; fi
                sleep 2
              done
              return 1
            }

            start_container() {
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              # Value-less -e flags inherit from the SSH session env, so
              # secret values never appear in the command line or ps. The
              # rollback path reuses this function and inherits the same env.
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart always \
                -p 3000:3000 \
                -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_REGION \
                -e RECAPTCHA_SECRET_KEY -e CONTACT_EMAIL_TO -e OFFICIAL_ACCOUNTS_JSON \
                --log-driver json-file \
                --log-opt max-size=10m --log-opt max-file=3 \
                "$1"
            }

            # Remember the currently running image so we can roll back to it.
            PREV_IMAGE="$(docker inspect -f '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"
            echo "Previous image: ${PREV_IMAGE:-<none>}"

            echo "Pulling $IMAGE ..."
            docker pull "$IMAGE"

            echo "Starting new container..."
            start_container "$IMAGE"

            if ! health_check; then
              echo "::error::Health check failed for $IMAGE"
              docker logs --tail 200 "$CONTAINER_NAME" 2>&1 || true

              if [ -n "$PREV_IMAGE" ] && docker image inspect "$PREV_IMAGE" >/dev/null 2>&1; then
                echo "Rolling back to $PREV_IMAGE ..."
                start_container "$PREV_IMAGE"
                if health_check; then
                  echo "Rollback OK - site is serving the previous version, but this deploy failed."
                else
                  echo "::error::Rollback is also unhealthy - manual intervention required."
                fi
              else
                echo "::error::No previous image available to roll back to."
                docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              fi
              exit 1
            fi

            # Retain only the newest $KEEP_IMAGES tags. `docker images` lists
            # newest-first, so everything past the cut-off is safe to drop.
            # Tagged images are not dangling, so `image prune` cannot remove
            # them on its own.
            echo "Cleaning up old images (keeping newest $KEEP_IMAGES)..."
            docker images "$IMAGE_REPO" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':latest$' \
              | tail -n +$((KEEP_IMAGES + 1)) \
              | xargs -r -n1 docker rmi -f >/dev/null 2>&1 || true

            docker container prune -f
            docker image prune -f

            echo "Deployment successful: $IMAGE"
